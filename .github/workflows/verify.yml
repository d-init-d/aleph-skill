name: verify

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  lockfiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix components/d-research

  component-provenance:
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Verify lock integrity and select provenance policy
        id: pin
        shell: bash
        run: |
          python -B scripts/lock_bundled_component.py
          python - <<'PYCODE'
          import json, os
          entry = json.load(open("component-lock.json", encoding="utf-8"))["components"]["d-research"]
          values = {"mode": entry.get("provenance", {}).get("mode", "upstream_release"),
                    "repository": entry["source_repository"], "tag": entry["source_tag"],
                    "tag_object": entry["upstream_tag_object"], "commit": entry["upstream_commit"]}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  if not isinstance(value, str) or "\n" in value or "\r" in value:
                      raise SystemExit("invalid provenance output")
                  print(f"{key}={value}", file=output)
          PYCODE
      - name: Verify local candidate snapshot without claiming upstream attestation
        if: steps.pin.outputs.mode == 'local_candidate'
        run: python -B scripts/lock_bundled_component.py
      - name: Verify the bundled snapshot against the pinned upstream tag
        if: steps.pin.outputs.mode == 'upstream_release'
        env:
          UPSTREAM_REPOSITORY: ${{ steps.pin.outputs.repository }}
          UPSTREAM_TAG: ${{ steps.pin.outputs.tag }}
          UPSTREAM_TAG_OBJECT: ${{ steps.pin.outputs.tag_object }}
          UPSTREAM_COMMIT: ${{ steps.pin.outputs.commit }}
        shell: bash
        run: |
          repo="$RUNNER_TEMP/d-research-upstream.git"
          test ! -e "$repo"
          git init --bare --quiet "$repo"
          git -C "$repo" remote add origin "$UPSTREAM_REPOSITORY"
          git -C "$repo" fetch --quiet --force --no-tags --depth=1 origin \
            "+refs/tags/$UPSTREAM_TAG:refs/tags/$UPSTREAM_TAG"
          tag_ref="refs/tags/$UPSTREAM_TAG"
          test "$(git -C "$repo" cat-file -t "$tag_ref")" = tag
          test "$(git -C "$repo" rev-parse "$tag_ref")" = "$UPSTREAM_TAG_OBJECT"
          test "$(git -C "$repo" rev-parse "$tag_ref^{}")" = "$UPSTREAM_COMMIT"
          provenance="$RUNNER_TEMP/component-provenance.json"
          python -B scripts/lock_bundled_component.py --require-upstream \
            --upstream-repo "$repo" > "$provenance"
          cat "$provenance"

  portable:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --extra test --python ${{ matrix.python-version }}
      - run: uv run --no-sync python scripts/release_gate.py

  component-no-browser:
    needs: lockfiles
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Verify locked component and package manifest
        run: |
          python -B scripts/lock_bundled_component.py
          cd components/d-research
          node scripts/runtime_self_test.mjs
      - name: Require an honest no-browser self-test status
        shell: bash
        run: |
          python -B scripts/research_gateway.py research:self-test --json > "$RUNNER_TEMP/research-self-test.json"
          python - "$RUNNER_TEMP/research-self-test.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("status") not in {"delegated", "degraded"}:
              raise SystemExit(f"no-browser self-test claimed {payload.get('status')!r}")
          delegated = payload.get("result", {}).get("delegated", [])
          if not any(item.get("code") == "CAPABILITY_BROWSER" for item in delegated):
              raise SystemExit("no-browser self-test omitted CAPABILITY_BROWSER delegation")
          PY
      - name: Require delegated browser cases in no-browser acceptance
        shell: bash
        run: |
          python -B scripts/research_gateway.py research:acceptance --json > "$RUNNER_TEMP/research-acceptance.json"
          python - "$RUNNER_TEMP/research-acceptance.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("status") not in {"delegated", "degraded"}:
              raise SystemExit(f"no-browser acceptance claimed {payload.get('status')!r}")
          reconciliation = payload.get("acceptance_reconciliation", {})
          if reconciliation.get("browser_cases_delegated", 0) < 1:
              raise SystemExit("no-browser acceptance did not delegate browser cases")
          PY

  browser-smoke:
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install the pinned optional browser capability outside the component
        shell: bash
        run: |
          npm ci --ignore-scripts --prefix components/d-research
          mv components/d-research/node_modules node_modules
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify component integrity after dependency staging
        run: python -B scripts/lock_bundled_component.py
      - name: Run real Chromium smoke through the Aleph gateway
        shell: bash
        run: |
          python -B scripts/research_gateway.py research:browser-smoke --timeout 600 --json > "$RUNNER_TEMP/browser-smoke.json"
          python - "$RUNNER_TEMP/browser-smoke.json" <<'PY'
          import json
          import sys

          payload = json.load(open(sys.argv[1], encoding="utf-8"))
          if payload.get("status") != "ok":
              raise SystemExit(f"browser smoke did not run: {payload.get('status')!r}")
          PY

  quality:
    needs: lockfiles
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.11.18"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-extras --python 3.13
      - run: uv run --no-sync python scripts/release_gate.py --with-dev
